springdoc:
  group-configs:
    - group: 'sopadmin'
      displayName: 'sop-admin服务'
      paths-to-match: '/**'
      packages-to-scan: cn.lmx.kpu.sop.controller

server:
  port: 18765


dubbo:
  protocol:
    name: dubbo
    port: -1
    parameters:
      sba: ignore
  application:
    qos-enable: false
  # 提供方
  provider:
    validation: jvalidationNew
  # 消费方
  consumer:
    check: false
    validation: jvalidationNew
  registry:
    address: nacos://${kpu.nacos.username}:${kpu.nacos.password}@${kpu.nacos.ip}:${kpu.nacos.port}?namespace=${kpu.nacos.namespace}
    check: false
