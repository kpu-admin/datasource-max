kpu: 
  echo:
    enabled: false
    aop-enabled: false
  system:
    enumPackage: ''    
  log:
    enabled: false
  webmvc:
    undertow: false
    header: false
  
         
spring:
  autoconfigure:
    exclude: io.seata.integration.http.HttpAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  cloud:
    gateway:
      server:
        webflux:
          x-forwarded:
            prefixEnabled: false
          discovery:
            locator:
              enabled: true
              lowerCaseServiceId: true
          routes:
            # 新建服务配置复制到中间
            # 新建服务配置复制到中间
            - id: oauth
              uri: lb://kpu-oauth-server
              predicates:
                - Path=/oauth/**
              filters:
                - StripPrefix=1
            - id: system
              uri: lb://kpu-system-server
              predicates:
                - Path=/system/**
              filters:
                - StripPrefix=1
            - id: base
              uri: lb://kpu-base-server
              predicates:
                - Path=/base/**
              filters:
                - StripPrefix=1
            # websocket
            - id: wsMsg
              uri: lb:ws://kpu-base-server
              predicates:
                - Path=/wsMsg/**
              filters:
                - StripPrefix=1    
            - id: generator
              uri: lb://kpu-generator-server
              predicates:
                - Path=/generator/**
              filters:
                - StripPrefix=1            
            - id: activiti
              uri: lb://kpu-activiti-server
              predicates:
                - Path=/activiti/**
              filters:
                - StripPrefix=1
            - id: sopadmin
              uri: lb://kpu-sop-admin-server
              predicates:
                - Path=/sopadmin/**
              filters:
                - StripPrefix=1       

server:
  port: 18760
  servlet:
    context-path: /api


nextdoc4j:
  enabled: true
  auth:
    enabled: true
    password: kpu
  gateway:
    auto-discovery: true
    # 读取各服务 /v3/api-docs/swagger-config，聚合所有分组（替代原 OpenApi3Controller）
    service-swagger-config-enabled: true
    # 必须按网关实际路由 id 填写，否则无关服务也会被聚合 —— 请核对你的路由 id
    include-patterns:
      - base
      - system
      - oauth
      - generator
      - sopadmin
    name-mappings:
      base: 基础服务
      system: 系统服务
      oauth: 认证服务
      generator: 代码生成器
      sopadmin: 开放平台