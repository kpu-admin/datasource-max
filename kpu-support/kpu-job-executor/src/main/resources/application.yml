    ipv6:
      xdbPath: file:./01-docs/ip2region_v6.xdb
  xss:
    enabled: false
    requestBodyEnabled: false
  nextdoc4j:
    license: Powered By lmx
    licenseUrl: https://github.com/***
    termsOfServiceUrl: https://github.com/***
    version: @project.version@
    contact: # 联系人信息
      url: https://github.com/***
      name: zuiou
      email: '***@qq.com'

### xxl-job email
xxl.job:
  #设置一：调度中心和执行器，均不设置AccessToken；关闭安全性校验；
  #设置二：调度中心和执行器，设置了相同的AccessToken；
  accessToken:
  # 以下是client 执行器端配置（注意：若不想配置调度器也是执行器，请自行参考xxl）
  admin:
    addresses: http://${JOBS_IP:127.0.0.1}:${JOBS_PORT:8767}/xxl-job-admin
  executor:
    # 执行器名
    appname: ${spring.application.name}
    address: ''
    # 调度器通过XXL-RPC跟执行器通信的IP
    ip: ${EXECUTOR_IP:127.0.0.1}
    # 调度器通过XXL-RPC跟执行器通信的端口
    port: ${EXECUTOR_PORT:8775}
    # 日志路径
    logpath: ${logging.file.path}/${spring.application.name}/jobhandler
    # 日志保留天数
    logretentiondays: 30



server:
  shutdown: GRACEFUL
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true
    context-path: /${spring.application.name}
  port: 8774
#  undertow:
#    threads:
#      io: 4 # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
#      worker: 80  # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
#    buffer-size: 2048  # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理 , 每块buffer的空间大小,越小的空间被利用越充分
#    direct-buffers: true  # 是否分配的直接内存

# mysql 通用配置
spring:
  application:
    name: @project.artifactId@
  mvc:
    pathmatch:
      # 升级springboot2.6.6后临时处理，防止swagger报错
      matching-strategy: ANT_PATH_MATCHER
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: dev
  lifecycle:
    # 优雅停机宽限期时间
    timeout-per-shutdown-phase: 30s
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  datasource:
    dynamic:
      enabled: true
      # 从这里开始(dynamic)，中间的这段配置用于 kpu.database.multiTenantType == DATASOURCE 时
      p6spy: ${kpu.database.p6spy:false}
      seata: ${kpu.database.isSeata:false}
      primary: "0"
      druid:
        initialSize: 10
        minIdle: 10
        maxActive: 200
        max-wait: 60000
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
        validation-query: SELECT 'x'
        test-on-borrow: false
        test-on-return: false
        test-while-idle: true
        time-between-eviction-runs-millis: 60000  #配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
        min-evictable-idle-time-millis: 300000    #配置一个连接在池中最小生存的时间，单位是毫秒
        filters: stat,wall
        wall:
          comment-allow: true
          multiStatementAllow: true
          noneBaseStatementAllow: true
      datasource:
        "0":
          <<: *db-mysql
    # 从这里结束(dynamic)，中间的这段配置用于 kpu.database.multiTenantType == DATASOURCE 时
    druid:
      enable: true
      web-stat-filter: # WebStatFilter配置，说明请参考Druid Wiki，配置_配置WebStatFilter
        enabled: true
        url-pattern: /*
        exclusions: "*.js , *.gif ,*.jpg ,*.png ,*.css ,*.ico , /druid/*"
        session-stat-max-count: 1000
        profile-enable: true
        session-stat-enable: false
      stat-view-servlet: #展示Druid的统计信息,StatViewServlet的用途包括：1.提供监控信息展示的html页面2.提供监控信息的JSON API
        enabled: true
        url-pattern: /druid/*   #根据配置中的url-pattern来访问内置监控页面，如果是上面的配置，内置监控页面的首页是/druid/index.html例如：http://127.0.0.1:9000/druid/index.html
        reset-enable: true    #允许清空统计数据
        login-username: kpu
        login-password: kpu
  cache:
    type: GENERIC
  data:
    redis:
      host: ${kpu.redis.ip}
      password: ${kpu.redis.password}
      port: ${kpu.redis.port}
      database: ${kpu.redis.database}
  rabbitmq:
    enabled: ${kpu.rabbitmq.enabled}
    host: ${kpu.rabbitmq.ip}
    port: ${kpu.rabbitmq.port}
    username: ${kpu.rabbitmq.username}
    password: ${kpu.rabbitmq.password}
    listener:
      type: direct # simple direct

mybatis-plus:
  mapper-locations:
    - classpath*:mapper_**/**/*Mapper.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: cn.lmx.kpu.*.entity;cn.lmx.basic.database.mybatis.typehandler
  typeEnumsPackage: cn.lmx.kpu.*.enumeration
  global-config:
    db-config:
      id-type: INPUT
      insert-strategy: NOT_NULL
      update-strategy: NOT_NULL
      select-strategy: NOT_EMPTY
  configuration:
    #配置返回数据库(column下划线命名&&返回java实体是驼峰命名)，自动匹配无需as（没开启这个，SQL需要写as： select user_id as userId）
    map-underscore-to-camel-case: true
    cache-enabled: false
    #配置JdbcTypeForNull, oracle数据库必须配置
    jdbc-type-for-null: 'null'

# NextDoc4j 在线文档配置
nextdoc4j:
  enabled: true
  # 文档访问密码（basic auth），生产环境请修改
  auth:
    enabled: true
    username: kpu
    password: kpu
  extension:
    enabled: true
    brand:
      footer-text: Apache License 2.0 | Copyright  2020 [kpu-cloud](https://github.com/***)



logging:
  file:
    path: '@logging.file.path@'
    name: ${logging.file.path}/${spring.application.name}/root.log
  level:
    root: INFO
    # 关闭不必要的日志
    org.reflections.Reflections: off
    com.alibaba.nacos.client: error
    com.alibaba.nacos.common.remote.client: error
    com.ulisesbocchio: error
    # 开发、调试需要的日志
    cn.lmx: info
    org.springframework: info
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
    console: "[${spring.application.name}:%X{TenantId}:%X{UserId}] %d{yyyy-MM-dd HH:mm:ss.SSS}[%5p] ${PID} [%X{trace}] [%t:%r] [%logger{50}.%M:%L] %m%n"
  logback:
    rollingpolicy:
      max-file-size: 64MB
